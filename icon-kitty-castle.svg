<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#fff5f7"/>
  <!-- Classic, minimalist Kitty-inspired face -->
  <g stroke="#231f20" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- head silhouette with the familiar two ears -->
    <path d="M55 204 L43 104 Q41 91 54 99 L132 145 Q174 128 218 145 L278 101 Q292 91 291 108 L283 208
      Q305 236 300 282 Q296 333 251 355 Q207 376 159 364 Q108 353 82 317 Q63 290 65 254 Q65 226 55 204Z"
      fill="#fff"/>
    <!-- ear inner detail kept very subtle -->
    <path d="M57 116 L112 149" fill="none" stroke="#f1c9d4" stroke-width="5"/>
    <path d="M274 119 L224 150" fill="none" stroke="#f1c9d4" stroke-width="5"/>
    <!-- classic red bow at Kitty's left ear -->
    <path d="M119 154 C91 125 62 136 70 163 C77 188 100 198 127 179 Z" fill="#ed174c" stroke="#c8103d" stroke-width="6"/>
    <path d="M128 154 C145 124 178 136 171 163 C165 187 144 198 126 179 Z" fill="#ed174c" stroke="#c8103d" stroke-width="6"/>
    <circle cx="126" cy="168" r="11" fill="#ff557b" stroke="#c8103d" stroke-width="5"/>
    <!-- two tiny oval eyes, no mouth, small yellow nose -->
    <ellipse cx="132" cy="250" rx="6" ry="10" fill="#231f20" stroke="none"/>
    <ellipse cx="224" cy="250" rx="6" ry="10" fill="#231f20" stroke="none"/>
    <ellipse cx="178" cy="269" rx="9" ry="6.5" fill="#ffd629" stroke="#d2a91d" stroke-width="2.5"/>
    <!-- three whiskers on each side -->
    <g fill="none" stroke-width="4.5">
      <path d="M111 253 L76 245 M111 267 L70 267 M113 281 L79 291"/>
      <path d="M244 253 L279 245 M244 267 L285 267 M242 281 L276 291"/>
    </g>
  </g>
  <!-- small Osaka Castle beside her, intentionally secondary -->
  <g stroke="#35313a" stroke-linejoin="round" stroke-linecap="round">
    <path d="M315 409V333H332V309H350V287H382V309H400V333H418V409Z" fill="#fff" stroke-width="5.5"/>
    <path d="M307 335L324 316L342 335Z M328 311L350 288L371 311Z M357 289L382 263L405 289Z M389 311L409 288L429 311Z M410 335L428 316L445 335Z" fill="#38333d" stroke-width="5"/>
    <path d="M338 352H397 M352 326H386" fill="none" stroke-width="4.5"/>
    <path d="M353 409V370H385V409Z" fill="#f3b6ca" stroke-width="3.5"/>
    <path d="M369 370V409" fill="none" stroke-width="3"/>
    <path d="M382 259V246M376 252H388" fill="none" stroke="#d4a12b" stroke-width="4"/>
  </g>
  <path d="M47 424Q150 411 256 424T465 424" fill="none" stroke="#e6a6b8" stroke-width="5.5" stroke-linecap="round"/>
</svg>