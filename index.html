<script>
    /* ==========================================
       DAY 分頁切換
       ========================================== */
    function switchDay(day) {

        // 隱藏所有 DAY
        document
            .querySelectorAll('.day-content')
            .forEach(function(el) {
                el.classList.remove('active');
            });

        // 移除所有按鈕 active
        document
            .querySelectorAll('.tab-btn')
            .forEach(function(el) {
                el.classList.remove('active');
            });

        // 顯示指定 DAY
        const target =
            document.getElementById('day' + day);

        if (target) {
            target.classList.add('active');
        }

        // 啟用指定按鈕
        const button =
            document.getElementById('btn-d' + day);

        if (button) {
            button.classList.add('active');
        }

        // 切換 DAY 後回到最上方
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }


    /* ==========================================
       Google Maps：單一目的地
       ========================================== */
    function goMap(destination) {

        const encodedDestination =
            encodeURIComponent(destination);

        const url =
            'https://www.google.com/maps/dir/?api=1' +
            '&destination=' +
            encodedDestination +
            '&travelmode=transit';

        // 新分頁開啟 Google Maps
        window.open(
            url,
            '_blank',
            'noopener,noreferrer'
        );
    }


    /* ==========================================
       Google Maps：起點 → 終點
       ========================================== */
    function goRoute(origin, destination) {

        const encodedOrigin =
            encodeURIComponent(origin);

        const encodedDestination =
            encodeURIComponent(destination);

        const url =
            'https://www.google.com/maps/dir/?api=1' +
            '&origin=' +
            encodedOrigin +
            '&destination=' +
            encodedDestination +
            '&travelmode=transit';

        // 新分頁開啟 Google Maps
        window.open(
            url,
            '_blank',
            'noopener,noreferrer'
        );
    }
</script>
